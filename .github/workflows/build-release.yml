name: Build cfg-view Client

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      versioned_tag: ${{ steps.release_info.outputs.versioned_tag }}
      versioned_name: ${{ steps.release_info.outputs.versioned_name }}
      latest_tag: latest-build
      latest_name: latest-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release info
        id: release_info
        shell: bash
        run: |
          version="$(node -p "require('./client/package.json').version")"
          echo "versioned_tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "versioned_name=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create versioned release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_info.outputs.versioned_tag }}
          name: ${{ steps.release_info.outputs.versioned_name }}
          commit: ${{ github.sha }}
          allowUpdates: true
          generateReleaseNotes: true
          prerelease: true

      - name: Create rolling latest release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-build
          name: latest-build
          commit: ${{ github.sha }}
          body: Latest auto build from ${{ github.sha }}
          allowUpdates: true
          prerelease: true

  build:
    name: Build ${{ matrix.target_name }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: win-x64
            runner: windows-latest
            build_script: build-client:win-x64
            artifact_pattern: '*.exe'
            release_file: cfg-view-win-x64.exe
          - target_name: linux-x64
            runner: ubuntu-latest
            build_script: build-client:linux-x64
            artifact_pattern: '*.AppImage'
            release_file: cfg-view-linux-x64.AppImage
          - target_name: linux-arm64
            runner: ubuntu-24.04-arm
            build_script: build-client:linux-arm64
            artifact_pattern: '*.AppImage'
            release_file: cfg-view-linux-arm64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 后端使用新版 Node fs 同步 API（readFileSync/appendFileSync/...），需 Node >= 22
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install client (electron-builder) dependencies
        working-directory: client
        run: npm ci

      - name: Prepare client resources (web + backend)
        working-directory: client
        run: npm run prep

      - name: Ensure app-builder is executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x client/node_modules/app-builder-bin/linux/*/app-builder || true

      - name: Build
        working-directory: client
        run: npm run ${{ matrix.build_script }}

      # 冒烟测试：内嵌后端能启动、窗口能打开（失败不阻断发布）
      - name: Smoke test packaged app (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: client
        shell: pwsh
        env:
          CFG_VAR_DIR: ${{ runner.temp }}/cfg-view-var
          CFG_SMOKE_TEST: '1'
        run: |
          $exe = (Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1).FullName
          & $exe
          exit $LASTEXITCODE

      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: client
        shell: bash
        env:
          CFG_VAR_DIR: ${{ runner.temp }}/cfg-view-var
          CFG_SMOKE_TEST: '1'
        run: |
          sudo apt-get update -q >/dev/null 2>&1
          sudo apt-get install -y -q xvfb >/dev/null 2>&1
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./dist/cfg-view-*.AppImage
          echo "AppImage smoke exit=$?"

      - name: Collect release asset
        working-directory: client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $files = @(Get-ChildItem -Path dist -Recurse -File | Where-Object { $_.Name -like "${{ matrix.artifact_pattern }}" -and $_.DirectoryName -notmatch "unpacked" })
          if ($files.Count -eq 0) {
            throw "No build artifact found for ${{ matrix.target_name }}"
          }
          $file = $files | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item -Path $file.FullName -Destination "release-assets/${{ matrix.release_file }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: client/release-assets/${{ matrix.release_file }}
          if-no-files-found: error

      - name: Publish versioned release asset
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare-release.outputs.versioned_tag }}
          artifacts: client/release-assets/${{ matrix.release_file }}
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: true

      - name: Publish rolling latest release asset
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare-release.outputs.latest_tag }}
          artifacts: client/release-assets/${{ matrix.release_file }}
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: true